{
  "name": "Antarix",
  "version": "0.1.0",
  "description": "Antarix local development environment",
  "projectId": "antarix-local",
  "api": {
    "enabled": true,
    "port": 54321,
    "schemas": ["public", "graphql_public"],
    "extra_search_path": ["public", "extensions"],
    "max_rows": 1000
  },
  "db": {
    "port": 54322,
    "shadow_port": 54320,
    "major_version": 15
  },
  "studio": {
    "enabled": true,
    "port": 54323,
    "api_url": "http://127.0.0.1"
  },
  "inbucket": {
    "enabled": true,
    "port": 54324
  },
  "auth": {
    "enabled": true,
    "site_url": "http://localhost:3000",
    "additional_redirect_urls": [
      "https://antarix.app",
      "https://college.antarix.app",
      "https://recruiting.antarix.app"
    ],
    "jwt_expiry": 3600,
    "enable_signup": true,
    "enable_anonymous_sign_ins": false,
    "enable_manual_linking": false
  },
  "auth.email": {
    "enable_signup": true,
    "double_confirm_changes": true,
    "enable_confirmations": true,
    "secure_password_change": true,
    "max_frequency": "1m0s",
    "otp_length": 6,
    "otp_expiry": 3600
  },
  "auth.external": {
    "github": {
      "enabled": true,
      "client_id": "env(GITHUB_CLIENT_ID)",
      "secret": "env(GITHUB_CLIENT_SECRET)",
      "redirect_uri": "http://localhost:54321/auth/v1/callback"
    },
    "google": {
      "enabled": true,
      "client_id": "env(GOOGLE_CLIENT_ID)",
      "secret": "env(GOOGLE_CLIENT_SECRET)",
      "redirect_uri": "http://localhost:54321/auth/v1/callback"
    }
  },
  "edge_runtime": {
    "enabled": true,
    "policy": "oneshot"
  },
  "experimental": {
    "webhooks": {
      "enabled": true
    }
  }
}
