name: Deploy Firecracker sandbox

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/sandbox-firecracker/**"
      - ".github/workflows/sandbox-firecracker-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sandbox-firecracker
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: ./scripts/deploy.sh
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_NAME: antarix-sandbox-ap-south-1
          FLY_REGION_PRIMARY: bom
