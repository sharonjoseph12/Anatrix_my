    ApiError:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      title: Generic API error
      description: |
        Standard error envelope for 400, 401, 404, 409, 500 responses.
        The `error` field is a stable machine-readable code; the
        `message` field is a human-readable expansion.
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Stable machine-readable error code.
          examples:
            - invalid_did
            - not_found
            - already_issued
            - unauthorized
            - invalid_request
            - db_error
            - no_issuer_key
            - build_failed
            - sign_failed
        message:
          type: string
          description: Human-readable error message.
          examples:
            - 'DID must match did:web:antarix.app:c/<uuid>.'
      additionalProperties: false

    RateLimitError:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      title: 429 Rate-limit error
      description: |
        429 response body. `retry_after` is also surfaced in the
        `Retry-After` response header.
      required:
        - error
        - retry_after
      properties:
        error:
          type: string
          const: rate_limited
        retry_after:
          type: integer
          minimum: 0
          description: Seconds the caller should wait before retrying.
          examples:
            - 1
      additionalProperties: false
      examples:
        - error: rate_limited
          retry_after: 1

